name: nix-s3-action test
on:
  pull_request:
  push:
    branches:
      - fork

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Install dependencies
        run: nix develop --command yarn install --frozen-lockfile
      - name: Build action
        run: nix develop --command yarn build
      - name: Test bundled action on Node.js 24
        run: nix develop --command yarn test
      - name: Check committed bundle
        run: git diff --exit-code -- dist yarn.lock
      - name: Test missing credentials
        uses: ./
        with:
          endpoint: s3://nix-s3-action-test
          signingKey: ''
          awsAccessKeyId: ''
          awsSecretAccessKey: ''
      - name: Test cache setup without uploading
        uses: ./
        with:
          endpoint: s3://nix-s3-action-test
          signingKey: test-signing-key
          awsAccessKeyId: test-access-key
          awsSecretAccessKey: test-secret-key
          skipPush: 'true'
      - name: Check cache setup
        run: |
          test -s "$HOME/.nix/nix-cache-key.sec"
          test -s "$HOME/.aws/credentials"
          test -s /tmp/store-path-pre-build
