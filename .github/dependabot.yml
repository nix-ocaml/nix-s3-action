version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: fork
    schedule:
      interval: daily
      time: '00:00'
      timezone: UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: npm
    directory: "/"
    target-branch: fork
    schedule:
      interval: weekly
    groups:
      actions-toolkit:
        patterns:
          - "@actions/*"
    commit-message:
      prefix: "chore"
      include: "scope"
